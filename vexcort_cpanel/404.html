<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found Ã¢â‚¬â€ Vexcort</title>
  <style>
    body {
      background-color: #f8fafc;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 0 20px;
    }
    .container {
      max-width: 450px;
      padding: 40px;
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(24, 0, 173, 0.08);
      box-shadow: 0 20px 50px rgba(24, 0, 173, 0.08);
    }
    h1 {
      font-size: 72px;
      font-weight: 900;
      margin: 0;
      background: linear-gradient(135deg, #1800AD 0%, #0EA5A4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h2 {
      font-size: 24px;
      font-weight: 800;
      margin: 16px 0 8px;
    }
    p {
      color: #64748b;
      font-size: 15px;
      line-height: 1.6;
      margin: 0 0 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1800AD 0%, #0EA5A4 100%);
      color: #ffffff;
      padding: 12px 28px;
      border-radius: 9999px;
      font-weight: 700;
      text-decoration: none;
      font-size: 14px;
      box-shadow: 0 10px 20px -5px rgba(24, 0, 173, 0.3);
      transition: transform 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
    <a href="/" class="btn">Go Home</a>
  </div>
</body>
</html>
